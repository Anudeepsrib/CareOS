[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]
pythonpath = ["services/platform-api", "."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["services/platform-api/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
