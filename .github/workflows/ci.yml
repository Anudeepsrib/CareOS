name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r services/platform_api/requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Bandit SAST (Python security)
        run: bandit -r services/platform_api/app services/memory_service/app services/agent_orchestration_service/app -ll --exclude '*/__pycache__/*,*/tests/*'
      - name: Dependency audit
        run: pip-audit -r services/platform_api/requirements.txt
      - name: Type check (basic)
        run: |
          cd services/platform_api
          PYTHONPATH=".:/workspace" python -c "
import app.main
print('platform-api main: OK')

# Explicitly exercise the sibling service imports that were previously broken by hyphen dirs
from services.agent_orchestration_service.app.deep_agents.deep_agent_factory import DeepAgentFactory
print('agent_orchestration_service (Deep Agents): OK')

from services.memory_service.app.services.hindsight_memory_service import HindsightMemoryService
print('memory_service (Hindsight Memory): OK')

print('Imports OK')
"
      - name: Run tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & build
        run: |
          cd apps/web
          npm ci
          npm run build
      - name: Typecheck
        run: cd apps/web && npm run typecheck
      - name: Dependency audit
        run: cd apps/web && npm audit --audit-level=high --omit=dev

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt & validate
        run: |
          cd infra/terraform/envs/dev
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (block on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          # For enterprise: add --skip-dirs node_modules,.venv, etc via trivy.yaml
      - name: Hadolint Dockerfile lint (Docker best practices)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/platform_api/Dockerfile
          # ignore some for slim base tradeoffs; tune per policy
          failure-threshold: warning
      - name: Hadolint web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
          failure-threshold: warning
      - name: Basic secret scan (grep patterns)
        run: |
          echo "Scanning for common hardcoded secrets..."
          ! grep -r -E "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|sk-[a-zA-Z0-9]{48}|AIza[0-9A-Za-z-_]{35})" --include="*.py" --include="*.ts" --include="*.js" --include="*.tf" --include="*.yml" --include="*.yaml" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=__pycache__ || (echo "Potential secret pattern found! Review immediately." && exit 1)
          echo "No obvious hardcoded AWS/keys found in source."
