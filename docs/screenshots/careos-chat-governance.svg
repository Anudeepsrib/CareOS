  <text x="756" y="160" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">Summarize the last 72 hours for PAT-DEMO-001 before rounds.</text>

  <rect x="304" y="220" width="780" height="328" rx="16" fill="#0f172a" stroke="#334155"/>
  <rect x="324" y="238" width="150" height="24" rx="5" fill="#1e293b"/>
  <text x="338" y="255" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">chart_summary</text>
  <text x="492" y="255" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12">conf 94%</text>
  <rect x="570" y="238" width="168" height="24" rx="5" fill="#451a03" stroke="#92400e"/>
  <text x="584" y="255" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12">human review ready</text>

