  <text x="34" y="635" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Architecture note</text>
  <text x="34" y="657" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="11">Every model call is gated by</text>
  <text x="34" y="674" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="11">MCP context governance.</text>

  <rect x="250" y="56" width="1030" height="664" fill="#020617"/>
