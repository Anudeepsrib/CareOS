  <text x="324" y="326" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Synthetic patient has improving respiratory status, stable vitals, and two discharge blockers:</text>
  <text x="344" y="354" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">1. Final home oxygen authorization remains pending.</text>
  <text x="344" y="380" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">2. Transportation confirmation is needed before discharge readiness.</text>
  <text x="324" y="420" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">This output is a draft summary for licensed clinician review, not a diagnosis or treatment decision.</text>

  <line x1="324" y1="448" x2="1050" y2="448" stroke="#1e293b"/>
  <text x="324" y="477" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">CITATIONS</text>
  <rect x="324" y="492" width="214" height="34" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="338" y="514" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">progress_note</text>
  <text x="552" y="514" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Authorized governed context only</text>

  <rect x="304" y="574" width="780" height="58" rx="10" fill="#111827" stroke="#374151"/>
  <text x="324" y="599" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="12">Standard disclaimer: summarize authorized records only. Not a diagnosis, prescription, or substitute for clinical judgment.</text>
  <text x="324" y="620" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="12">Governed memory preference applied: concise bullet summary format.</text>

  <rect x="304" y="660" width="760" height="38" rx="12" fill="#020617" stroke="#334155"/>
  <text x="326" y="684" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">Ask anything about labs, discharge, risk, or general education...</text>
  <rect x="1082" y="660" width="98" height="38" rx="12" fill="#0891b2"/>
  <text x="1114" y="684" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Send</text>
